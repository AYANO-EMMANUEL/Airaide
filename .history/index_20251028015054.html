    <section class="background-container">
      <!-- Lottie background -->
      <dotlottie-wc
        id="heroLottie"
        src="https://lottie.host/51f534cd-2cce-4e29-83f9-720d43cf4c48/ouD2ismwlF.lottie"
        autoplay
        loop
        style="
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          z-index: -1;

        "
      ></dotlottie-wc>

      <!-- Foreground content -->

          <div class="logo">

            <span>Services</span>
            <span>Projects</span>
            <span>Insights</span>
            <span>Training</span>
            <span>About us</span>
          </div>
          <button>Get in Touch</button>
        </nav>

        <section class="hero-content">
          <h1 class="hero-header">Pioneering the Future of Technology</h1>
        </section>
      </section>
    </section>
