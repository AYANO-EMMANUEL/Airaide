<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airaide</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="background-container">
        <lottie-player
            src="assets/icon/"
            background="transparent"
            speed="1"
            loop
            autoplay
            style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; object-fit: cover;">
        </lottie-player>
        <nav class="d-flex justify-content-between">
            <div class="logo">
                <img src="./assets/icon/Frame 1618868979.svg" alt="" class="img-fluid">
            </div>
            <div class="d-flex text-nowrap justify-content-between">
                <span class="">Services</span>
                <span class="">Projects</span>
                <span class="">Insights</span>
                <span class="">Training</span>
                <span class="">About us</span>
            </div>
            <button class="">
                Get in Touch
            </button>
        </nav>

        <section class="h-100">
            <h1 class="hero-header">
                Pioneering the Future of Technology
            </h1>

        </section>
    </section>
</body>

<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</html>
